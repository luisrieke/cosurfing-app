[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# City covers in the app (src/lib/storage.ts coverUrl) and link-preview images
# (netlify/edge-functions/seo.ts) are served through the Image CDN, never hotlinked.
[images]
  remote_images = [
    "https://(upload|thumb)\\.wikimedia\\.org/.*",
    "https://[a-z0-9]+\\.supabase\\.co/storage/v1/object/public/.*",
  ]

# The map is the home page. Old /map links get a real 301 (query string kept) instead of the
# client-side <Redirect> in app/map.tsx, so crawlers see a permanent redirect and index / instead.
[[redirects]]
  from = "/map"
  to = "/"
  status = 301

# Single-page app: every route is handled by Expo Router on the client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
