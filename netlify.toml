[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Link-preview images (netlify/edge-functions/social-meta.ts): city covers and place photos.
[images]
  remote_images = [
    "https://(upload|thumb)\\.wikimedia\\.org/.*",
    "https://[a-z0-9]+\\.supabase\\.co/storage/v1/object/public/.*",
  ]

# Single-page app: every route is handled by Expo Router on the client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
